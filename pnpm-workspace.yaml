packages:
  - packages/*

allowBuilds:
  better-sqlite3: true
  electron: true
  # windows installer builder — not used; the mac/linux targets don't need it
  electron-winstaller: false
  esbuild: true
  node-pty: true

catalog:
  zod: ^4.0.0
  typescript: ^5.9.0
  vitest: ^3.2.0
  tsx: ^4.20.0

onlyBuiltDependencies:
  - better-sqlite3
  - node-pty
  - esbuild
  # electron's postinstall downloads the runtime binary
  - electron
